<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tabulador de vendas · Clube Smiles</title><link rel="stylesheet" href="style.css"></head><body>
<header><img class="club" src="assets/clube-smiles.png" alt="Clube Smiles" width="96" height="52"><div><h1>Tabulador de vendas</h1><img class="cnx" src="assets/concentrix.webp" alt="Concentrix" width="112" height="19"></div></header>
<main><div class="section-title"><h2>Registrar venda</h2><button type="button" class="text-button" id="clear" disabled>Limpar Dados</button></div>
<p id="connection" class="connection" role="status">Conectando…</p>
<form id="sale-form" novalidate><fieldset id="sale-fields" disabled><legend class="sr-only">Dados da venda</legend>
<div class="field"><label for="segment">Segmento</label><select id="segment" required aria-describedby="segment-error"><option value="">Selecione o segmento</option></select><span id="segment-error" class="field-error"></span></div>
<div class="field"><label for="agent">Seu nome</label><select id="agent" required disabled aria-describedby="agent-error"><option value="">Selecione o segmento primeiro</option></select><span id="agent-error" class="field-error"></span></div>
<div class="field"><label for="member">Número de membro Smiles</label><input id="member" type="text" required inputmode="numeric" pattern="[0-9]+" autocomplete="off" placeholder="Somente números" aria-describedby="member-error"><span id="member-error" class="field-error"></span></div>
<div class="field"><label for="plan">Plano vendido</label><select id="plan" required aria-describedby="plan-error"><option value="">Selecione o plano</option><option>1.000</option><option>2.000</option><option>5.000</option><option>7.000</option><option>10.000</option><option>20.000</option></select><span id="plan-error" class="field-error"></span></div>
<fieldset id="billing-group" class="billing" disabled aria-describedby="billing-error"><legend>Modalidade</legend><label><input id="annual" type="radio" name="billing" value="ANUAL" required> Anual</label><label><input id="monthly" type="radio" name="billing" value="MENSAL" required> Mensal</label><span id="billing-error" class="field-error"></span></fieldset>
<div class="field" id="chat-type-field" hidden><label for="saleType">Tipo de venda</label><select id="saleType" disabled aria-describedby="saleType-error"><option value="">Selecione o tipo de venda</option><option>Venda</option><option>Upgrade</option><option>Regularização</option><option>Renovação</option></select><span id="saleType-error" class="field-error"></span></div><div class="field"><label for="observation">Observações <span class="optional">(opcional)</span></label><textarea id="observation" rows="2" maxlength="50000" style="resize: none" placeholder="Informações adicionais da venda" aria-describedby="observation-error"></textarea><span id="observation-error" class="field-error"></span></div>
</fieldset><button type="submit" id="submit" class="primary" disabled>Registrar venda ↗</button></form>
<div id="feedback" class="feedback" role="status" aria-live="polite"></div><button id="retry" class="secondary" type="button" disabled hidden>Tentar conectar novamente</button></main>
<script type="module" src="app.js"></script></body></html>
